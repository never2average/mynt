name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
  # Mynt's Solana toolchain, installed by the same pinned, checksum-verified script the sandboxes run, builds the
  # coding agents' template Anchor program verifiably and tests it on a local validator, exactly as Mynt's verify
  # sandbox does (src/solana/toolchain.ts).
  solana-program:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Mynt's scripts, from its source
        run: |
          mkdir -p "$RUNNER_TEMP/mynt"
          node -e 'import("./dist/solana/toolchain.js").then((m) => { const fs = require("fs"); fs.writeFileSync(process.argv[1] + "/solana-toolchain.sh", m.SOLANA_TOOLCHAIN_SCRIPT); fs.writeFileSync(process.argv[1] + "/solana-verify.sh", m.SOLANA_VERIFY_SCRIPT); })' "$RUNNER_TEMP/mynt"
          node -e 'import("./dist/solana/gate-scripts.js").then((m) => require("fs").writeFileSync(process.argv[1] + "/program-analysis.sh", m.GATE_ANALYSIS_SCRIPT))' "$RUNNER_TEMP/mynt"
      - name: Install the pinned toolchain
        run: bash "$RUNNER_TEMP/mynt/solana-toolchain.sh"
      - name: Scaffold the template program, as a coding agent would
        run: python3 workspaces/coding-build/scripts/scaffold_program.py "$RUNNER_TEMP/app/solana" --name ci_ledger --program-id HJx8vD5GCm2j31s1ThrpmV6vGvS9xmjEuDAJJk5m8Qyw
      - name: Verifiable build in a container, then tests on a local validator, as Mynt verifies a build
        run: |
          : > "$RUNNER_TEMP/checks.jsonl"
          # Two runs, as in Mynt's verify sandbox: the build alone (only inside a container that has a copy of the
          # source), then, after Mynt has read the programs back, the IDL and the tests on the host.
          bash "$RUNNER_TEMP/mynt/solana-verify.sh" build "$RUNNER_TEMP/app" "$RUNNER_TEMP/out" "$PWD/schemas/solana-crate-allowlist.json"
          cat "$RUNNER_TEMP/out/checks.jsonl" >> "$RUNNER_TEMP/checks.jsonl"
          sha256sum "$RUNNER_TEMP"/out/*.so | tee "$RUNNER_TEMP/built.sha"
          bash "$RUNNER_TEMP/mynt/solana-verify.sh" test "$RUNNER_TEMP/app" "$RUNNER_TEMP/out" "$RUNNER_TEMP/checks.jsonl" "$RUNNER_TEMP/mynt/solana-toolchain.sh"
          sha256sum -c "$RUNNER_TEMP/built.sha"
          cat "$RUNNER_TEMP/checks.jsonl" "$RUNNER_TEMP/out/programs.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys
          tmp = sys.argv[1]
          checks = {c["name"]: c for c in map(json.loads, open(f"{tmp}/checks.jsonl"))}
          assert checks["solana_build"]["status"] == "pass", checks["solana_build"]
          assert checks["solana_tests"]["status"] == "pass", checks["solana_tests"]
          programs = json.load(open(f"{tmp}/out/programs.json"))
          assert [p["name"] for p in programs] == ["ci_ledger"], programs
          assert programs[0]["declared_id"] == "HJx8vD5GCm2j31s1ThrpmV6vGvS9xmjEuDAJJk5m8Qyw", programs
          # The Cargo.lock the build used is hashed with the program; the template commits none, so a warning, not a failure.
          import hashlib, re
          assert re.fullmatch(r"[0-9a-f]{64}", programs[0]["cargo_lock_sha256"] or ""), programs
          assert programs[0]["cargo_lock_committed"] is False, programs
          assert hashlib.sha256(open(f"{tmp}/out/solana.Cargo.lock", "rb").read()).hexdigest() == programs[0]["cargo_lock_sha256"]
          assert "warning: no Cargo.lock committed" in checks["solana_build"]["detail"], checks["solana_build"]
          PY
      - name: The mainnet program gate passes the template as Mynt captured it, and refuses a token vault
        run: |
          # What the build kept: the workspace exactly as it went into the container, every crate of the Cargo.lock
          # it used (and the source of any off the allowlist), and the IDL built in Mynt's own offline container.
          python3 - "$RUNNER_TEMP" <<'PY'
          import hashlib, json, os, sys
          tmp = sys.argv[1]
          [prog] = json.load(open(f"{tmp}/out/programs.json"))
          for key in ("sources", "deps", "idl"):
              raw = open(f"{tmp}/out/{prog[key]}", "rb").read()
              assert hashlib.sha256(raw).hexdigest() == prog[f"{key}_sha256"] and len(raw) == prog[f"{key}_size"], (key, prog)
          bundle = json.load(open(f"{tmp}/out/{prog['sources']}"))
          files = bundle["files"]
          # Everything the container got, dot-folders and tests included; nothing it didn't.
          for f in ("programs/ci_ledger/src/lib.rs", "programs/ci_ledger/Cargo.toml", "Anchor.toml", "package.json", ".cargo/config.toml", "tests/ci_ledger.ts"):
              assert f in files, (f, sorted(files))
          assert not any(f.startswith(("target/", "node_modules/", ".anchor/")) for f in list(files) + list(bundle["binary"])), sorted(files)
          deps = json.load(open(f"{tmp}/out/{prog['deps']}"))
          off = sorted({p["name"] for p in deps["packages"] if p.get("source") and not p["allowlisted"]})
          print("crates in the template's Cargo.lock:", len(deps["packages"]), "| off the allowlist:", json.dumps(off))
          assert deps["complete"], deps["problems"]
          assert not off, f"add the template's crates to schemas/solana-crate-allowlist.json after review: {off}"
          assert all(p.get("crate_sha256") == p.get("checksum") for p in deps["packages"] if p.get("source")), "checksums"
          idl = json.load(open(f"{tmp}/out/{prog['idl']}"))
          assert [i["name"] for i in idl["instructions"]] == ["initialize", "record"], idl["instructions"]
          json.dump(bundle, open(f"{tmp}/captured.json", "w"))
          for path, text in files.items():
              os.makedirs(os.path.dirname(f"{tmp}/captured/{path}") or f"{tmp}/captured", exist_ok=True)
              open(f"{tmp}/captured/{path}", "w").write(text)
          open(f"{tmp}/captured/Cargo.lock", "w").write(deps["lock"])
          PY
          node scripts/program-rules.mjs --sources "$RUNNER_TEMP/captured.json" --program-id HJx8vD5GCm2j31s1ThrpmV6vGvS9xmjEuDAJJk5m8Qyw \
            --so "$RUNNER_TEMP/out/ci_ledger.so" --idl "$RUNNER_TEMP/out/ci_ledger.build-idl.json" --deps "$RUNNER_TEMP/out/solana.deps.json" \
            --depinfo "$RUNNER_TEMP/out/solana.depinfo.json" > "$RUNNER_TEMP/rules.json" || { cat "$RUNNER_TEMP/rules.json"; exit 1; }
          python3 - "$RUNNER_TEMP/rules.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print("IDL check:", r["idl"])
          assert r["passed"] and all(r["rules"]["signals"].values()), r
          assert r["idl"]["verified"], r["idl"]
          assert r["exceptions"] == [], r["exceptions"]
          assert r["dependencies"]["refusals"] == [] and r["dependencies"]["off_allowlist"] == [], r["dependencies"]
          # What rustc read, from the build container's dep-info: exactly the program's one source file of the workspace,
          # and crates' files that match their .crate.
          print("compiled:", r["compiled"]["registry_files"], "registry files;", "generated:", r["compiled"]["generated"])
          assert r["compiled"]["problems"] == [], r["compiled"]["problems"]
          assert r["compiled_files"] == ["programs/ci_ledger/src/lib.rs"], r["compiled_files"]
          assert r["compiled"]["registry_files"] > 100, r["compiled"]
          PY
          if node scripts/program-rules.mjs --workspace test/fixtures/solana-programs/token_vault --program-id HJx8vD5GCm2j31s1ThrpmV6vGvS9xmjEuDAJJk5m8Qyw > "$RUNNER_TEMP/bad.json"; then
            echo "the token vault passed the hard rules"; cat "$RUNNER_TEMP/bad.json"; exit 1
          fi
          grep -q "anchor_spl::token" "$RUNNER_TEMP/bad.json"
          # Static analysis, as in the gate's sandbox: cargo-audit (on the Cargo.lock the build used) and Radar, pinned.
          bash "$RUNNER_TEMP/mynt/program-analysis.sh" "$RUNNER_TEMP/captured" "$RUNNER_TEMP/analysis"
          cat "$RUNNER_TEMP/analysis/static.json"
          node -e 'import("./dist/solana/mainnet-gate.js").then((m) => { const r = m.assessStatic(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))); console.log(JSON.stringify(r.reasons)); if (!r.passed) process.exit(1); })' "$RUNNER_TEMP/analysis/static.json"
      - name: A module whose file is picked by cfg_attr is read as rustc reads it (dep-info), and refused
        run: |
          python3 workspaces/coding-build/scripts/scaffold_program.py "$RUNNER_TEMP/app5/solana" --name ci_ledger --program-id HJx8vD5GCm2j31s1ThrpmV6vGvS9xmjEuDAJJk5m8Qyw
          src="$RUNNER_TEMP/app5/solana/programs/ci_ledger/src"
          printf '\n#[cfg_attr(any(), path = "clean.rs")]\npub mod y;\n' >> "$src/lib.rs"
          echo 'pub fn ok() {}' > "$src/clean.rs"
          echo 'pub fn permanent_delegate_note() {}' > "$src/y.rs"
          bash "$RUNNER_TEMP/mynt/solana-verify.sh" build "$RUNNER_TEMP/app5" "$RUNNER_TEMP/out5" "$PWD/schemas/solana-crate-allowlist.json"
          grep -q '"status": "pass"' "$RUNNER_TEMP/out5/checks.jsonl" || { cat "$RUNNER_TEMP/out5/checks.jsonl"; exit 1; }
          if node scripts/program-rules.mjs --sources "$RUNNER_TEMP/out5/solana.sources.json" --program-id HJx8vD5GCm2j31s1ThrpmV6vGvS9xmjEuDAJJk5m8Qyw \
              --deps "$RUNNER_TEMP/out5/solana.deps.json" --depinfo "$RUNNER_TEMP/out5/solana.depinfo.json" > "$RUNNER_TEMP/rules5.json"; then
            echo "the cfg_attr module passed"; cat "$RUNNER_TEMP/rules5.json"; exit 1
          fi
          python3 - "$RUNNER_TEMP/rules5.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          print(r["compiled_files"], [e["id"] for e in r["exceptions"]])
          assert r["compiled"]["problems"] == [], r["compiled"]
          assert "programs/ci_ledger/src/y.rs" in r["compiled_files"] and "programs/ci_ledger/src/clean.rs" not in r["compiled_files"], r["compiled_files"]
          assert any(f["rule"] == "RUG-TOKEN2022-EXTENSIONS" and f["file"] == "programs/ci_ledger/src/y.rs" for f in r["rules"]["findings"]), r["rules"]["findings"]
          assert any(e["kind"] == "cfg_attr_path" for e in r["exceptions"]), r["exceptions"]
          PY
      - name: A build script that rewrites the program on the host can't change what Mynt captures, and is caught
        run: |
          # The attack: outside a container, the program's build.rs overwrites every built program it can reach.
          cat > "$RUNNER_TEMP/app/solana/programs/ci_ledger/build.rs" <<'RS'
          use std::{env, fs, path::Path};
          fn main() {
              println!("cargo:rerun-if-changed=build.rs");
              if Path::new("/.dockerenv").exists() {
                  // Inside the build container the network must be gone: reaching out fails the build.
                  let addr = "1.1.1.1:443".parse().unwrap();
                  if std::net::TcpStream::connect_timeout(&addr, std::time::Duration::from_secs(3)).is_ok() { panic!("the build container reached the network"); }
                  return;
              }
              let Ok(dir) = env::var("MYNT_CI_ATTACK_DIR") else { return };
              fs::write(Path::new(&dir).join("host-ran"), b"").unwrap();
              for e in fs::read_dir(&dir).unwrap().flatten() {
                  let p = e.path();
                  if p.extension().map_or(false, |x| x == "so") {
                      let _ = std::process::Command::new("chmod").arg("u+w").arg(&p).status();
                      fs::write(&p, b"swapped on the host").unwrap();
                  }
              }
          }
          RS
          export MYNT_CI_ATTACK_DIR="$RUNNER_TEMP/out2"
          bash "$RUNNER_TEMP/mynt/solana-verify.sh" build "$RUNNER_TEMP/app" "$RUNNER_TEMP/out2"
          # Up to the point Mynt reads the program back, the build script never ran on the host, and what's there
          # is the program the container built.
          grep -q '"status": "pass"' "$RUNNER_TEMP/out2/checks.jsonl"
          [ ! -e "$RUNNER_TEMP/out2/host-ran" ] || { echo "the build ran developer code on the host"; exit 1; }
          [ "$(head -c 4 "$RUNNER_TEMP/out2/ci_ledger.so" | od -An -tx1 | tr -d ' \n')" = 7f454c46 ]
          (cd "$RUNNER_TEMP/out2" && sha256sum ci_ledger.so) | tee "$RUNNER_TEMP/captured.sha"
          # The host-side run (IDL and tests) executes the build script, which rewrites the copy: Mynt's re-hash
          # after the tests must see it.
          : > "$RUNNER_TEMP/checks2.jsonl"
          bash "$RUNNER_TEMP/mynt/solana-verify.sh" test "$RUNNER_TEMP/app" "$RUNNER_TEMP/out2" "$RUNNER_TEMP/checks2.jsonl" "$RUNNER_TEMP/mynt/solana-toolchain.sh"
          [ -e "$RUNNER_TEMP/out2/host-ran" ] || { echo "the attack never ran: this check proves nothing"; exit 1; }
          if (cd "$RUNNER_TEMP/out2" && sha256sum -c "$RUNNER_TEMP/captured.sha"); then echo "the host-side rewrite went unnoticed"; exit 1; fi
          echo "caught: the program changed after Mynt captured it"
      - name: A build script that swaps a program for a link to a host file is refused
        run: |
          python3 workspaces/coding-build/scripts/scaffold_program.py "$RUNNER_TEMP/app3/solana" --name ci_ledger --program-id HJx8vD5GCm2j31s1ThrpmV6vGvS9xmjEuDAJJk5m8Qyw
          # A second crate, built after ci_ledger, whose build script (in the container) replaces ci_ledger.so with
          # a link to /etc/hostname: copied out as a link, the host would read its own /etc/hostname.
          cp -r "$RUNNER_TEMP/app3/solana/programs/ci_ledger" "$RUNNER_TEMP/app3/solana/programs/zz_attacker"
          sed -i 's/ci_ledger/zz_attacker/g' "$RUNNER_TEMP/app3/solana/programs/zz_attacker/Cargo.toml"
          cat > "$RUNNER_TEMP/app3/solana/programs/zz_attacker/build.rs" <<'RS'
          use std::{fs, os::unix::fs::symlink, path::Path};
          fn main() {
              println!("cargo:rerun-if-changed=build.rs");
              if !Path::new("/.dockerenv").exists() { return; }
              let target = Path::new("/workdir/docker-target/deploy/ci_ledger.so");
              let _ = fs::remove_file(target);
              symlink("/etc/hostname", target).unwrap();
          }
          RS
          bash "$RUNNER_TEMP/mynt/solana-verify.sh" build "$RUNNER_TEMP/app3" "$RUNNER_TEMP/out3"
          cat "$RUNNER_TEMP/out3/checks.jsonl"
          grep -q '"name": "solana_build", "status": "fail"' "$RUNNER_TEMP/out3/checks.jsonl"
          grep -q "ci_ledger.so isn't a program" "$RUNNER_TEMP/out3/checks.jsonl"
          [ -z "$(find "$RUNNER_TEMP/out3" -type l)" ] || { echo "a link was copied out"; exit 1; }
          [ ! -e "$RUNNER_TEMP/out3/ci_ledger.so" ] || { echo "the swapped program was kept"; exit 1; }
          echo "refused: the swapped program was never kept"
      - name: A rustc wrapper in the source's cargo config never runs with network, and can't swap the program after the build
        run: |
          python3 workspaces/coding-build/scripts/scaffold_program.py "$RUNNER_TEMP/app4/solana" --name ci_ledger --program-id HJx8vD5GCm2j31s1ThrpmV6vGvS9xmjEuDAJJk5m8Qyw
          printf '\n[build]\nrustc-wrapper = "./wrap.sh"\n' >> "$RUNNER_TEMP/app4/solana/.cargo/config.toml"
          cat > "$RUNNER_TEMP/app4/solana/wrap.sh" <<'SH'
          #!/bin/bash
          # Run with a network (as the old fetch step did): fail loudly, so a passing build proves it never was.
          if timeout 3 bash -c '</dev/tcp/1.1.1.1/443' 2>/dev/null; then echo "MYNT-ATTACK: the wrapper ran with network" >&2; exit 97; fi
          # Offline (the build): leave a process behind that, once the program exists, swaps it for another valid ELF.
          if mkdir /tmp/mynt-swapper 2>/dev/null; then
            ( f=/workdir/docker-target/deploy/ci_ledger.so
              while :; do if [ -f "$f" ]; then sleep 2; cp "$f" /tmp/x && printf X >> /tmp/x && cp /tmp/x "$f"; exit; fi; sleep 0.2; done ) >/dev/null 2>&1 &
          fi
          exec "$@"
          SH
          chmod +x "$RUNNER_TEMP/app4/solana/wrap.sh"
          bash "$RUNNER_TEMP/mynt/solana-verify.sh" build "$RUNNER_TEMP/app4" "$RUNNER_TEMP/out4"
          cat "$RUNNER_TEMP/out4/checks.jsonl"
          ! grep -q MYNT-ATTACK "$RUNNER_TEMP"/out4/*.log || { echo "the wrapper ran with network"; exit 1; }
          grep -q '"name": "solana_build", "status": "pass"' "$RUNNER_TEMP/out4/checks.jsonl"
          [ "$(tail -c 1 "$RUNNER_TEMP/out4/ci_ledger.so")" != X ] || { echo "the program was swapped after the build"; exit 1; }
          (cd "$RUNNER_TEMP/out4" && sha256sum ci_ledger.so)
          [ "$(sha256sum < "$RUNNER_TEMP/out4/ci_ledger.so" | cut -d' ' -f1)" = "$(cut -d' ' -f1 "$RUNNER_TEMP/built.sha")" ] || { echo "the captured program isn't the honest build"; exit 1; }
          echo "held: the wrapper never had a network and the captured program is the honest build"
      - name: Logs
        if: failure()
        run: for f in "$RUNNER_TEMP"/out*/*.log; do echo "::group::$f"; tail -n 120 "$f"; echo "::endgroup::"; done
  # The starter app the coding agents scaffold (api, web, Expo mobile) compiles against a freshly generated SDK,
  # and its Compose images build.
  starter-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/fixtures/generate-client-sdks.mjs sdk-out
      - run: python3 workspaces/coding-build/scripts/scaffold_app.py starter --sdk sdk-out
      - name: api, web and mobile compile
        working-directory: starter
        run: |
          npm install --no-audit --no-fund
          npm run build -w mynt-sdk
          npm run build -w mynt-sdk-react-native
          npm run typecheck -w api
          npm run build -w web
          npm run typecheck -w mobile
      - name: Compose images build
        working-directory: starter
        env:
          MYNT_API_KEY: mynt_test_ci
          MYNT_API_ORIGIN: https://mynt.example
        run: |
          rm -rf node_modules */node_modules packages/*/node_modules packages/*/dist
          docker compose --profile mobile build
      - name: The app runs hardened (read-only, no capabilities) and serves
        working-directory: starter
        env:
          MYNT_API_KEY: mynt_test_ci
          MYNT_API_ORIGIN: https://mynt.example
        run: |
          docker compose --profile mobile up -d --wait --wait-timeout 120
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/api/healthz | grep -q '"ok":true'
          # Only client-session routes are forwarded to Mynt; anything else under /v1 is the app's own page.
          curl -fsS -o /dev/null -w '%{content_type}' http://127.0.0.1:8080/v1/products | grep -q text/html
          docker compose --profile mobile exec -T mobile wget -qO- http://127.0.0.1:8081/ | grep -qi '<!doctype html>'
          docker compose --profile mobile down -v
  # Generates every device SDK for a defined product and compiles the native ones with their own toolchains.
  client-sdks:
    # Pinned: swift-actions/setup-swift refuses Ubuntu 26.04, which ubuntu-latest has moved to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/fixtures/generate-client-sdks.mjs sdk-out
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin compiles
        run: |
          curl -fsSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip
          curl -fsSL -o json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          ./kotlinc/bin/kotlinc sdk-out/kotlin/src/main/kotlin -cp json.jar -d kotlin-sdk.jar
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.5.4"
      - name: Dart analyzes
        working-directory: sdk-out/flutter
        run: dart pub get && dart analyze --fatal-warnings
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"
      - name: Swift builds
        working-directory: sdk-out/swift
        run: swift build
  # The native mobile starters (templates/mynt-app-mobile), scaffolded the way the coding agents do it against a
  # freshly generated SDK, and compiled with each platform's own toolchain.
  starter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/fixtures/generate-client-sdks.mjs sdk-out
      - run: python3 workspaces/coding-build/scripts/scaffold_app.py starter --sdk sdk-out --mobile kotlin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android app builds
        working-directory: starter/mobile
        run: |
          gradle wrapper --gradle-version 8.9
          ./gradlew :app:assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
  starter-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/fixtures/generate-client-sdks.mjs sdk-out
      - run: python3 workspaces/coding-build/scripts/scaffold_app.py starter --sdk sdk-out --mobile flutter
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Flutter app analyzes, tests and builds
        working-directory: starter/mobile
        run: |
          flutter create --platforms=android,ios --project-name mynt_starter .
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug
  starter-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node test/fixtures/generate-client-sdks.mjs sdk-out
      - run: python3 workspaces/coding-build/scripts/scaffold_app.py starter --sdk sdk-out --mobile swift
      - name: SwiftUI app builds (macOS)
        working-directory: starter/mobile
        run: swift build
      - name: SwiftUI app builds (iOS simulator)
        working-directory: starter/mobile
        run: xcodebuild -scheme MyntStarter -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
