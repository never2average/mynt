name: mynt_starter
description: Runs a Mynt journey on a client session minted by your api.
version: 0.1.0
publish_to: none
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  url_launcher: ^6.3.0
  # The generated Dart SDK, copied next to this app by scaffold_app.py.
  __MYNT_SDK_PACKAGE__:
    path: mynt_sdk
flutter:
  uses-material-design: true
